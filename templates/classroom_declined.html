<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cannot Attend — EduCore</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family:'Sora',sans-serif; background:#f8fafc; display:flex; align-items:center;
               justify-content:center; min-height:100vh; }
        .card { border-radius:20px; border:none; box-shadow:0 8px 40px rgba(0,0,0,.1);
                padding:40px; max-width:440px; width:90%; text-align:center; }
        .icon { font-size:4rem; margin-bottom:20px; }
        h2 { font-size:1.4rem; font-weight:700; color:#0f172a; margin-bottom:8px; }
        p { color:#64748b; font-size:0.9rem; margin-bottom:24px; }
        .info-box { background:#f8fafc; border-radius:12px; padding:16px; margin-bottom:24px; text-align:left; }
        .info-box .label { font-size:0.72rem; font-weight:700; text-transform:uppercase;
                           letter-spacing:0.5px; color:#94a3b8; }
        .info-box .value { font-size:0.9rem; font-weight:600; color:#0f172a; }
        .btn-home { background:#1a56db; color:white; border:none; border-radius:10px;
                    padding:12px 28px; font-family:'Sora',sans-serif; font-weight:600;
                    cursor:pointer; text-decoration:none; display:inline-block; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📋</div>
        <h2>Response Recorded</h2>
        <p>Your response has been saved and your teacher has been notified.</p>
        <div class="info-box">
            <div class="label">Student</div>
            <div class="value mb-2">{{ student_name }}</div>
            <div class="label">Course</div>
            <div class="value mb-2">{{ classroom.course_code }} — {{ classroom.course_name }}</div>
            <div class="label">Status</div>
            <div class="value" style="color:#dc2626;">❌ Cannot Attend</div>
        </div>
        <a href="{{ url_for('student_dashboard') }}" class="btn-home">← Back to Dashboard</a>
    </div>
</body>
</html>
