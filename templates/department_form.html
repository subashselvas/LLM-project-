{% extends "base.html" %}

{% block title %}{{ form_title }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-12">
            <h2><i class="fas fa-{{ 'edit' if department else 'plus' }}"></i> {{ form_title }}</h2>
            <hr>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Department Information</h5>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('department_add' if not department else 'department_edit', id=department.id if department else 0) }}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="dept_code" class="form-label">Department Code *</label>
                                <input type="text" class="form-control" id="dept_code" name="dept_code" 
                                       value="{{ department.dept_code if department else '' }}" required>
                                <small class="text-muted">e.g., CS, MATH, ENG</small>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="dept_name" class="form-label">Department Name *</label>
                                <input type="text" class="form-control" id="dept_name" name="dept_name" 
                                       value="{{ department.dept_name if department else '' }}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3">{{ department.description if department else '' }}</textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="head_of_department" class="form-label">Head of Department</label>
                                <input type="text" class="form-control" id="head_of_department" name="head_of_department" 
                                       value="{{ department.head_of_department if department else '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="office_location" class="form-label">Office Location</label>
                                <input type="text" class="form-control" id="office_location" name="office_location" 
                                       value="{{ department.office_location if department else '' }}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label">Phone</label>
                                <input type="tel" class="form-control" id="phone" name="phone" 
                                       value="{{ department.phone if department else '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" 
                                       value="{{ department.email if department else '' }}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="established_date" class="form-label">Established Date</label>
                                <input type="date" class="form-control" id="established_date" name="established_date" 
                                       value="{{ department.established_date if department else '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="budget" class="form-label">Annual Budget</label>
                                <input type="number" class="form-control" id="budget" name="budget" 
                                       value="{{ department.budget if department else '' }}" step="0.01" min="0">
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Save Department
                            </button>
                            <a href="{{ url_for('department_list') }}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
